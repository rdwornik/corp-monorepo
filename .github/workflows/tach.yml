name: Tach

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tach
        run: pip install tach==0.34.0
      - name: Check import boundaries
        run: tach check
