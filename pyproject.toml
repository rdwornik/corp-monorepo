[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corp"
version = "1.0.0"
description = "Corporate OS — knowledge management for Blue Yonder presales"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "anthropic>=0.40.0",
    "click>=8.1",
    "colorama>=0.4",
    "google-genai>=1.50",
    "httpx>=0.28",
    "Jinja2>=3.0",
    "json-repair>=0.30",
    "numpy>=1.24",
    "ollama>=0.4.0",
    "openai>=2.14",
    "opencv-python>=4.8.0",
    "openpyxl>=3.1.0",
    "packaging>=23.0",
    "pdfplumber>=0.10.0",
    "pillow>=9.0",
    "pydantic>=2.0",
    "pydub>=0.25.1",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
    "python-pptx>=1.0.0",
    "PyYAML>=6.0",
    "requests>=2.32",
    "rich>=14.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
]

[project.optional-dependencies]
slides = ["comtypes; sys_platform == 'win32'", "PyMuPDF>=1.20.0"]
dedup = ["datasketch>=1.6"]
graph = ["msal>=1.24"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.8",
    "hypothesis",
]

[project.scripts]
corp = "corp.cli:cli"
corp-meta = "corp.schema.cli:main"
cke = "corp.extractor.scripts.run:cli"
cpe = "corp.project.cli:cli"
com = "corp.opportunity.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"corp.schema" = ["taxonomy.yaml", "data/*.yaml"]
"corp.extractor" = ["data/*.yaml", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
# E402: load_dotenv() must run before env-dependent imports (rfp agent pattern)
ignore = ["E402"]
