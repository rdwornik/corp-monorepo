# Arm ALL THREE git-hook stages on every `pre-commit install` (incl. the
# methodology floor's plain SessionStart arm leg) -- without this, commit-msg /
# pre-push stage hooks land wired-but-dormant (the ai-council arming gap,
# hub #275; hub arms the same three via scripts/arm_hooks.py).
default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # ruff-format omitted: core.autocrlf=true on Windows causes CRLF/LF conflict
      # in pre-commit's stash/unstash cycle. Run `ruff format packages/` manually
      # or via dev-check.ps1 instead.

  - repo: local
    hooks:
      - id: tach-check
        name: tach (import boundaries)
        entry: tach check
        language: system
        pass_filenames: false
        files: ^src/corp/.*\.py$

      - id: normalize-headers
        name: normalize dated-log headers (JOURNAL/LESSONS)
        entry: py scripts/normalize_headers.py
        language: system
        pass_filenames: true
        files: ^(JOURNAL|LESSONS)\.md$
      - id: floor-hash-verify
        name: Verify CLAUDE-FLOOR.md matches its sha256 sidecar
        entry: python .claude/check_floor_hash.py
        language: system
        files: ^\.claude/CLAUDE-FLOOR\.md(\.sha256)?$
        pass_filenames: false
      - id: canonical_freshness
        name: canonical_freshness last_reviewed gate (A2 FAIL blocks the commit)
        entry: python scripts/canonical_freshness_gate.py
        language: system
        always_run: true
        pass_filenames: false

  # Doc-tooling hooks single-sourced from the .dev-knowledge hub (ADR-71 pilot).
  # rev pinned to a STABLE hub commit (69558c7 = "hub becomes the codemap+TOC
  # hook source repo"; HEAD at pilot time, no tag). Never pin to a moving ref.
  # NOTE: only the TOC hooks are consumed. The codemap hooks are intentionally
  # NOT consumed: corp's codemap is hand-authored (ARCHITECTURE.md §Codemap,
  # ADR-51 amendment 2026-05-22, "not generator-managed"), and the hub generator
  # cannot model corp's single-package src/corp/ layout (corp.-prefixed imports +
  # dotted tach.toml keys yield a 0-edge, 0-layer orphan graph). See JOURNAL
  # 2026-06-03 + .claude/skills/gotchas. Codemap generator adoption is deferred
  # pending a hub-side fix.
  - repo: ../.dev-knowledge
    rev: v1.2.0
    hooks:
      - id: toc-freshness
        files: '^ARCHITECTURE\.md$'
      - id: toc-generate  # manual stage only: pre-commit run toc-generate --hook-stage manual
