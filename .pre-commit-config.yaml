# Arm ALL THREE git-hook stages on every `pre-commit install` (incl. the
# methodology floor's plain SessionStart arm leg) -- without this, commit-msg /
# pre-push stage hooks land wired-but-dormant (the ai-council arming gap,
# hub #275; hub arms the same three via scripts/arm_hooks.py).
default_install_hook_types: [pre-commit, commit-msg, pre-push]

# Scope stage-less hooks to the pre-commit stage. Without this, every hook
# with no `stages:` re-runs at the commit-msg + pre-push stages too (now that
# all three are installed), printing a misleading "(no files to check) Skipped"
# second batch per commit. Hooks meant for other stages declare `stages:`
# explicitly (same shape ai-council uses).
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff
        args: []   # check-only gate (fleet-canonical form): violations surface + block, not auto-fixed
      # ruff-format omitted: core.autocrlf=true on Windows causes CRLF/LF conflict
      # in pre-commit's stash/unstash cycle. Run `ruff format packages/` manually
      # or via dev-check.ps1 instead.

  - repo: local
    hooks:
      - id: tach-check
        name: tach (import boundaries)
        entry: tach check
        language: system
        pass_filenames: false
        files: ^src/corp/.*\.py$

      - id: normalize-headers
        name: normalize dated-log headers (JOURNAL/LESSONS)
        entry: py scripts/normalize_headers.py
        language: system
        pass_filenames: true
        files: ^(JOURNAL|LESSONS)\.md$
      - id: floor-hash-verify
        name: Verify CLAUDE-FLOOR.md matches its sha256 sidecar
        entry: python .claude/check_floor_hash.py
        language: system
        files: ^\.claude/CLAUDE-FLOOR\.md(\.sha256)?$
        pass_filenames: false
      - id: canonical_freshness
        name: canonical_freshness last_reviewed gate (A2 FAIL blocks the commit)
        entry: python scripts/canonical_freshness_gate.py
        language: system
        always_run: true
        pass_filenames: false
      # ADR-101 R4 (fleet ruling d1): every ADDED docs/audits/*.md name must be all-lowercase
      # kebab-case. Carries ONLY the casing branch of the hub validate_hermetization gate
      # (Rule A tree-seal + Rule B enum/date-grammar stay hub-local -- see .methodology.yaml
      # audit-casing-r4). Prospective-only + 11-name enumerated skip-set; the script does its
      # own `git diff --cached --diff-filter=A`, so always_run + no pass_filenames.
      - id: validate-audit-casing
        name: docs/audits/*.md lowercase-kebab casing gate (ADR-101 R4, prospective)
        entry: python scripts/validate_audit_casing.py
        language: system
        always_run: true
        pass_filenames: false

      # BACKLOG.md story-map schema gate. This is the PLUGIN TWIN of the hub validator
      # (.dev-knowledge/plugins/tier1-lifecycle/scripts/validate_backlog.py, 239-line
      # E/S-agnostic form), copied byte-identical per ADR-78 carrier-doctrine (NOT the hub
      # root 356-line E/S-coupled script, which is HUB-ONLY and would hard-fail corp). Early
      # adoption ahead of the #281/#286 durable carrier -- operator D1 disposition / #331
      # consumer-adoption ruling. To be superseded by the carrier when it ships.
      - id: validate-backlog
        name: validate BACKLOG.md story-map schema
        entry: python scripts/validate_backlog.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # Doc-tooling + enforcement hooks single-sourced from the .dev-knowledge hub, pinned to the
  # published methodology tag v1.3.1 (canonical GitHub source = fleet-standard form; ai-council parity).
  # Consumed: the two enforcement gates -- backlog-id-on-close (commit-msg) and block-ff-push
  # (pre-push, armed at v1.3.1 which post-dates the #318/#319 range-reconstruction fixes).
  # The two TOC hooks are NO LONGER consumed: corp dropped its ARCHITECTURE.md ToC block per fleet
  # ticket #326 (ARCHITECTURE.md is CC-facing; a rendered ToC is human-facing chrome -- hub set the
  # precedent). With no ToC markers to keep fresh, the toc-freshness binding (was keyed ^ARCHITECTURE\.md$)
  # and toc-generate are withdrawn; the hooks stay AVAILABLE from the hub, only corp's binding is removed.
  # The codemap hooks are also intentionally NOT consumed: corp's codemap is hand-authored (ARCHITECTURE.md
  # §Codemap, ADR-51 amendment 2026-05-22, "not generator-managed"), and the hub generator cannot model
  # corp's single-package src/corp/ layout (corp.-prefixed imports + dotted tach.toml keys yield a
  # 0-edge, 0-layer orphan graph). See JOURNAL 2026-06-03 + .claude/skills/gotchas; both divergences
  # recorded machine-readably in .methodology.yaml (hub-toc-hooks + hub-codemap-hooks waivers).
  - repo: https://github.com/rdwornik/dev-knowledge
    rev: v1.3.1
    hooks:
      - id: backlog-id-on-close
      - id: block-ff-push
