      revisited with the fleet-template-membership question (the hub's own .vscode entry
      carries the same 2026-08-26 review_date).
    review_date: 2026-08-26

  # --- [COLORS] declared-interim adoption (2026-07-29 operator ruling) -----------------
  - component: vscode-boundary-decoration
    reason: >-
      DECLARED-UNTIL-MECHANISM: corp-monorepo carries the hub's .vscode boundary decoration
      (settings.json highlight keys + extensions.json recommendation for
      fabiospampinato.vscode-highlight) MANUALLY, ahead of the editor-config carrier --
