    reason: >-
      corp-monorepo tracks .vscode/ (shared workspace editor settings, adopted 2026-07-12).
      Not part of the intake #12 fleet template, so the #328 root-sweep flags it undeclared.
      Declared as a sanctioned local editor-config surface. Fleet-parity register e1
