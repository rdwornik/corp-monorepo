# Consumer conformance metadata read by the hub Informant
# (.dev-knowledge scripts/enforcement_coverage.py, [#244] P4 / D2).
# Each entry: component id + MANDATORY reason + time-box (expiry or review_date).
sanctioned_divergences:
  - component: ruff-gate
    reason: >-
      corp-monorepo runs its OWN ruff gate (v0.15.8, --fix, .ruff.toml E/F/I) --
      consumer property adopted before the methodology, not methodology residue.
      The v1.2.0 ruff-gate tombstone's removal does NOT propagate here (ADR-96
      amendment 2026-07-06: greenfield deploy skipped the prune sweep; durable
      per-consumer prune scoping is hub #276).
    review_date: 2026-10-07
  - component: hub-codemap-hooks
    reason: >-
      corp-monorepo does NOT consume the codemap-freshness / codemap-generate hub
      hooks. Its codemap is hand-authored (ARCHITECTURE.md §Codemap, ADR-51 amendment
      2026-05-22, "not generator-managed"): corp is a single-package src/corp/ layout
      whose corp.-prefixed imports + dotted tach.toml keys make the hub generator
      degenerate to a 0-edge, 0-layer orphan graph, so `codemap check` ALWAYS reports a
      diff -- wiring it as an active gate would block every commit touching src/*.py /
      ARCHITECTURE.md / pyproject.toml / tach.toml. Same exclusion as ai-council (also
      hand-authored, single-package). hub-codemap-hooks is waivable:true in
      manifest-v1.3.x. NOTE: the deploy tool does not yet read this waiver (hub #276
      design-deferred) -- a real deploy/tool.py --execute would re-append
      codemap-freshness on a rev bump; re-remove until #276 lands.
    review_date: 2026-10-11
  - component: hub-toc-hooks
    reason: >-
      corp-monorepo no longer consumes the toc-freshness / toc-generate hub hooks.
      Its ARCHITECTURE.md ToC block was removed per fleet ticket #326 (operator ruling:
      ARCHITECTURE.md is CC-facing; a rendered ToC is human-facing chrome -- the hub set
      the precedent by stripping its own ToC in the #326 hub leg). With no ToC markers to
      keep fresh, the toc-freshness binding (was keyed ^ARCHITECTURE\.md$) is withdrawn and
      toc-generate (manual stage) with it. The hooks stay AVAILABLE from the hub at v1.3.1 --
      only corp's binding is removed. NOTE: manifest v1.3.1's fleet-generic install set still
      DECLARES toc-freshness/toc-generate keyed on ARCHITECTURE.md even though the hub itself
      dropped toc-on-ARCHITECTURE; this waiver is expected to RETIRE when the manifest re-scopes
      (or removes) the toc hooks from the generic set -- at which point corp is no-longer-divergent.
    review_date: 2026-10-11
  - component: audit-casing-r4
    reason: |-
      corp enforces the R4 casing branch ONLY of hub ADR-101's validate_hermetization
      gate: every ADDED docs/audits/*.md must be all-lowercase kebab-case (no UPPERCASE,
      no _underscore_, no CamelCase; sole carve-out a literal `.` for a repo/version token).
      Authority: hub ADR-101 R4 (fleet ruling d1, hub
      docs/audits/2026-07-11-technical-fleet-parity-register.md) -- cross-repo pointer; the
      register lives in the hub, not corp; do not hunt for it here.
      Two hub-gate branches are NOT carried and stay hub-local:
        (1) Rule A top-level tree-seal (sanctioned Tier-1 dirs/files + docs/<genre> set);
        (2) Rule B CLOSED 11-class audit-class enum + YYYY-MM-DD date-shape grammar --
            corp audit files use free lowercase slugs (estate-recon, deep-dealloop,
            foundation-review) outside that enum, so carrying it would over-block.
      corp runs the casing branch via scripts/validate_audit_casing.py, prospective-only
      (git diff --cached --diff-filter=A; MODIFIED/existing files never checked).
      Boundary: corp ADR-14 still governs MyWork content-file naming
      ({YYYY-MM}_{TYPE}_{CLIENT}_ UPPERCASE codes, config/naming_config.yaml) -- OUT OF SCOPE.
      The 11 pre-existing UPPERCASE _TYPE_ files are grandfathered by ENUMERATION (declared
      here + carried as a skip-set in the script), never by pattern:
        2026-07-07_AUDIT_demo-prep-recon.md
        2026-07-07_BRAINSTORM-BACKLOG_functional-requirements.md
        2026-07-07_BRIEF_algorithmic-adopt-map.md
        2026-07-07_BRIEF_golden-url-registry-knowledge-flow.md
        2026-07-07_BRIEF_obsidian-operating-model-v2.md
        2026-07-07_BRIEF_ontology-north-star.md
        2026-07-07_EVIDENCE_by-product-docs-tree-analysis.md
        2026-07-07_HANDOFF_functional-architect.md
        2026-07-08_AUDIT_fa-campaign-self-review.md
        2026-07-08_BRIEF_metadata-charter-T1.md
        2026-07-11_AUDIT_root-parity-disposition.md
    review_date: 2026-10-12
